apiVersion: v1
kind: Secret
metadata:
  name: project-secrets
type: Opaque
data:
  # Replace these base64 placeholders with real values before applying
  JWT_SECRET: "REPLACE_WITH_BASE64_JWT_SECRET"
  MONGO_USER: "REPLACE_WITH_BASE64_MONGO_USER"
  MONGO_PASSWORD: "REPLACE_WITH_BASE64_MONGO_PASSWORD"
  # MONGO_URI can be constructed from the other values, but provide as optional override
  MONGO_URI: "REPLACE_WITH_BASE64_MONGO_URI"
