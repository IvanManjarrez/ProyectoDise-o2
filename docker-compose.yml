# ==========================================
# AR ART GALLERY - DOCKER COMPOSE
# ==========================================
# Levanta toda la arquitectura de microservicios
# Incluye: MongoDB, Redis, Auth, API Gateway, Composition, Museum Proxy, Adaptadores
# 
# Uso: docker-compose up -d --build
# Para parar: docker-compose down
# Ver logs: docker-compose logs -f [servicio]

services:
  
  # ==========================================
  # BASE DE DATOS - MongoDB
  # ==========================================
  mongodb:
    image: mongo:6
    container_name: ar-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: artgallery
      MONGO_INITDB_ROOT_PASSWORD: secure123
      MONGO_INITDB_DATABASE: artgallery
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - ar-network

  # ==========================================
  # CACHÉ - Redis  
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: ar-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ar-network

  # ==========================================
  # ADAPTADOR HARVARD
  # ==========================================
  harvard-adapter:
    build: ./backend/adapters/harvard-adapter
    container_name: ar-harvard
    restart: unless-stopped
    environment:
      - PORT=3013
      - HARVARD_API_KEY=4229f68b-585d-4c60-8d4a-00adafc8719c
    ports:
      - "3013:3013"
    networks:
      - ar-network

  # ==========================================
  # ADAPTADOR MET
  # ==========================================
  met-adapter:
    build: ./backend/adapters/met-adapter
    container_name: ar-met
    restart: unless-stopped
    environment:
      - PORT=3012
    ports:
      - "3012:3012"
    networks:
      - ar-network

  # ==========================================
  # MUSEUM PROXY SERVICE
  # ==========================================
  museum-proxy:
    build: ./backend/museum-proxy-service
    container_name: ar-museum-proxy
    restart: unless-stopped
    environment:
      - PORT=3010
      - REDIS_URL=redis://redis:6379
      - MET_ADAPTER_URL=http://met-adapter:3012
      - HARVARD_ADAPTER_URL=http://harvard-adapter:3013
    ports:
      - "3010:3010"
    depends_on:
      - redis
      - met-adapter
      - harvard-adapter
    networks:
      - ar-network

  # ==========================================
  # AUTH SERVICE
  # ==========================================
  auth-service:
    build: ./backend/auth-service
    container_name: ar-auth
    restart: unless-stopped
    environment:
      - PORT=3001
      - MONGO_URI=mongodb://artgallery:secure123@mongodb:27017/auth-service?authSource=admin
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
    ports:
      - "3001:3001"
    depends_on:
      - mongodb
    networks:
      - ar-network

  # ==========================================
  # COMPOSITION SERVICE
  # ==========================================
  composition-service:
    build: ./backend/composition-service
    container_name: ar-composition
    restart: unless-stopped
    environment:
      - PORT=3002
      - MUSEUM_PROXY_URL=http://museum-proxy:3010
      - REDIS_URL=redis://redis:6379
    ports:
      - "3002:3002"
    depends_on:
      - redis
      - museum-proxy
    networks:
      - ar-network

  # ==========================================
  # API GATEWAY
  # ==========================================
  api-gateway:
    build: ./backend/api-gateway
    container_name: ar-gateway
    restart: unless-stopped
    environment:
      - PORT=3000
      - AUTH_SERVICE_URL=http://auth-service:3001
      - COMPOSITION_SERVICE_URL=http://composition-service:3002
      - MUSEUM_PROXY_SERVICE_URL=http://museum-proxy:3010
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - THROTTLE_TTL=60000
      - THROTTLE_LIMIT=10
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - composition-service
      - museum-proxy
    networks:
      - ar-network

# ==========================================
# REDES
# ==========================================
networks:
  ar-network:
    driver: bridge

# ==========================================
# VOLÚMENES
# ==========================================
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local